    function previewUpload(input, containerId, imgId) {
        const container = document.getElementById(containerId);
        const img = document.getElementById(imgId);
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function (e) {
                img.src = e.target.result;
                container.classList.remove('hidden');
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            container.classList.add('hidden');
            img.src = "";
        }
    }
            // --- Kartu Anggota Digital (Hadiah Spesial) ---
        function generateDigitalCard() {
            try {
                let idStr = document.getElementById('viewId').innerText;
                const id = idStr ? idStr.trim() : "";
                const ang = masterData.find(d => String(d.ID) === id);
                if (!ang) {
                    showToast("Gagal: Data anggota tidak ditemukan di sistem!", false);
                    return;
                }

                const canvas = document.getElementById('digitalCardCanvas');
                if (!canvas) {
                    showToast("Gagal: Komponen kanvas tidak ditemukan!", false);
                    return;
                }
                const ctx = canvas.getContext('2d');
                
                // Set canvas size (Standard ID Card size ratio 3.375 x 2.125 inches)
                canvas.width = 600;
                canvas.height = 950; // Vertical orientation

                // Background Gradient (PDI Perjuangan Theme)
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#dc2626'); // red-600
                gradient.addColorStop(0.4, '#b91c1c'); // red-700
                gradient.addColorStop(1, '#7f1d1d'); // red-900
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Add background pattern/overlay
                ctx.globalAlpha = 0.05;
                for(let i=0; i<canvas.width; i+=40) {
                    for(let j=0; j<canvas.height; j+=40) {
                        ctx.beginPath();
                        ctx.arc(i, j, 15, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1.0;

                // Header Section
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, 180);

                // Try to load PDI Logo (using the one from manifest)
                const logo = new Image();
                logo.crossOrigin = "Anonymous";
                
                const drawRest = (logoImg) => {
                    if (logoImg) {
                        ctx.drawImage(logoImg, 30, 20, 140, 140);
                    } else {
                        // Fallback Text if logo fails
                        ctx.fillStyle = '#dc2626';
                        ctx.font = 'bold 24px Arial';
                        ctx.fillText('LOGO', 60, 100);
                    }
                    
                    // Draw Header Text
                    ctx.fillStyle = '#b91c1c';
                    ctx.font = 'bold 38px Arial';
                    ctx.textAlign = 'left';
                    ctx.fillText('PDI PERJUANGAN', 190, 70);
                    
                    ctx.font = 'bold 24px Arial';
                    ctx.fillStyle = '#dc2626';
                    ctx.fillText('PENGURUS ANAK CABANG', 190, 105);
                    
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 22px Arial';
                    ctx.fillText('KECAMATAN KAWUNGANTEN', 190, 140);

                    // Draw Separator Line
                    ctx.fillStyle = '#fbbf24'; // amber-400
                    ctx.fillRect(0, 180, canvas.width, 10);

                    // Load User Photo
                    const photo = new Image();
                    photo.crossOrigin = "Anonymous";
                    const getDriveId = (url) => {
                        if(!url) return null;
                        const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        return match ? match[1] : (url.length > 20 && !url.includes('http') ? url : null);
                    };
                    const passId = getDriveId(ang.PASS_FOTO);
                    if (passId) {
                        const driveUrl = 'https://drive.google.com/thumbnail?id=' + passId + '&sz=w400';
                        photo.src = 'https://corsproxy.io/?' + encodeURIComponent(driveUrl);
                    } else {
                        photo.src = 'https://via.placeholder.com/300?text=FOTO';
                    }
                    
                    photo.onload = () => {
                        drawCardContent(ctx, canvas, ang, photo);
                    };
                    
                    let fallbackTried = false;
                    photo.onerror = () => {
                        if (!fallbackTried && passId) {
                            fallbackTried = true;
                            // Secondary proxy fallback
                            const driveUrl = 'https://drive.google.com/thumbnail?id=' + passId + '&sz=w400';
                            photo.src = 'https://images1-focus-opensocial.googleusercontent.com/gadgets/proxy?container=focus&refresh=2592000&url=' + encodeURIComponent(driveUrl);
                        } else {
                            // Final fallback if photo completely fails
                            const fallback = new Image();
                            fallback.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiB2aWV3Qm94PSIwIDAgMjQgMjQiPjxwYXRoIGZpbGw9IiNjY2MiIGQ9Ik0xMiAxMmMtMi4yMSAwLTQtMS43OS00LTRzMS43OS00IDQtNCA0IDEuNzkgNCA0LTEuNzkgNC00IDR6bTAgMmMtMi42NyAwLTggMS4zNC04IDR2MmgxNnYtMmMwLTIuNjYtNS4zMy00LTgtNHoiLz48L3N2Zz4=';
                            fallback.onload = () => drawCardContent(ctx, canvas, ang, fallback);
                        }
                    }
                };

                logo.onload = () => drawRest(logo);
                logo.onerror = () => drawRest(null);
                
                // Set Logo from Base64
                logo.src = typeof APP_LOGO !== 'undefined' ? APP_LOGO : '';
                
                // Show Modal while loading
                if (typeof toggleModal === 'function') {
                    toggleModal('digitalCardModal', true);
                } else {
                    document.getElementById('digitalCardModal').classList.remove('opacity-0', 'pointer-events-none');
                }
            } catch (e) {
                console.error(e);
                showToast("Terjadi kesalahan: " + e.message, false);
            }
        }

        function drawCardContent(ctx, canvas, ang, photo) {
            // Draw Photo Box with border
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(170, 240, 260, 310);
            
            // Draw Photo
            let sWidth = photo.width;
            let sHeight = photo.height;
            let dWidth = 240;
            let dHeight = 290;
            
            let ratio = Math.max(dWidth/sWidth, dHeight/sHeight);
            let cWidth = dWidth / ratio;
            let cHeight = dHeight / ratio;
            let cX = (sWidth - cWidth) / 2;
            let cY = (sHeight - cHeight) / 2;
            
            ctx.drawImage(photo, cX, cY, cWidth, cHeight, 180, 250, dWidth, dHeight);

            // Draw White Content Box
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(30, 580, canvas.width - 60, 310, 20);
            ctx.fill();

            // Draw User Info
            ctx.textAlign = 'center';
            
            ctx.fillStyle = '#b91c1c';
            ctx.font = 'bold 32px Arial';
            let nama = (ang.NAMA || 'TANPA NAMA').toUpperCase();
            if (nama.length > 25) { ctx.font = 'bold 24px Arial'; }
            ctx.fillText(nama, canvas.width/2, 630);
            
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 18px Arial';
            ctx.fillText('NIK: ' + (ang.NIK || '-'), canvas.width/2, 660);

            ctx.fillStyle = '#fca5a5';
            ctx.fillRect(100, 680, canvas.width - 200, 2);

            ctx.textAlign = 'left';
            ctx.font = 'bold 16px Arial';
            ctx.fillStyle = '#64748b';
            
            let startY = 715;
            let lineH = 30;
            let labelX = 60;
            let valueX = 220;
            
            ctx.fillText('TTL', labelX, startY);
            ctx.fillText('JABATAN', labelX, startY + lineH);
            ctx.fillText('TINGKAT', labelX, startY + lineH*2);
            ctx.fillText('DESA/DUSUN', labelX, startY + lineH*3);
            ctx.fillText('MASA BAKTI', labelX, startY + lineH*4);
            
            for(let i=0; i<5; i++) {
                ctx.fillText(':', valueX - 20, startY + (lineH * i));
            }
            
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 18px Arial';
            ctx.fillText((ang.TANGGAL_LAHIR || '-'), valueX, startY);
            ctx.fillText((ang.JABATAN || '-').toUpperCase(), valueX, startY + lineH);
            
            let bagian = (ang.BAGIAN || '-').toUpperCase();
            ctx.fillStyle = '#dc2626';
            ctx.fillText(bagian, valueX, startY + lineH*2);
            
            ctx.fillStyle = '#0f172a';
            ctx.fillText((ang.DESA || '-') + ' / ' + (ang.DUSUN || '-'), valueX, startY + lineH*3);
            ctx.fillText('2026 - 2031', valueX, startY + lineH*4);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'italic 14px Arial';
            ctx.fillText('KARTU IDENTITAS RESMI PENGURUS PDI PERJUANGAN', canvas.width/2, 925);
        }

            const modal = document.getElementById('digitalCardModal');
            if(modal) modal.classList.add('opacity-0', 'pointer-events-none');

        function downloadDigitalCard() {
            const canvas = document.getElementById('digitalCardCanvas');
            const url = canvas.toDataURL('image/jpeg', 0.9);
            const nama = document.getElementById('viewNama').innerText.trim().replace(/[^a-zA-Z0-9]/g, '_');
            
            const link = document.createElement('a');

            link.href = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Kartu berhasil diunduh!", true);
        }

    // --- PWA Support ---
    function injectManifest() {
        const logoUrl = typeof APP_LOGO !== 'undefined' ? APP_LOGO : '';
        const manifest = {
            "name": "PAC KAWUNGANTEN",
            "short_name": "PAC KWT",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#dc2626",
            "icons": [
                {
                    "src": logoUrl,
                    "sizes": "192x192",
                    "type": "image/png",
                    "purpose": "any maskable"
                },
                {
                    "src": logoUrl,
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(blob);

        const linkManifest = document.createElement('link');
        linkManifest.rel = 'manifest';
        linkManifest.href = manifestURL;
        document.head.appendChild(linkManifest);
        
        // Force inject icons into DOM for Chrome/iOS fallback
        if (logoUrl) {
            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon';
            linkApple.href = logoUrl;
            document.head.appendChild(linkApple);
            
            const linkIcon = document.createElement('link');
            linkIcon.rel = 'icon';
            linkIcon.type = 'image/png';
            linkIcon.href = logoUrl;
            document.head.appendChild(linkIcon);
            
            const linkShortcut = document.createElement('link');
            linkShortcut.rel = 'shortcut icon';
            linkShortcut.type = 'image/png';
            linkShortcut.href = logoUrl;
            document.head.appendChild(linkShortcut);
        }
    }
